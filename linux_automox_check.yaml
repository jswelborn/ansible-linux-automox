---
- name: Check and remediate Automox Agent service
  hosts: all
  become: true
  gather_facts: false

  vars:
    service_name: amagent.service
    automox_startup_wait: 5

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
      register: automox_service_facts
      ignore_unreachable: true

    - name: End compliance check for unreachable host
      ansible.builtin.meta: end_host
      when: automox_service_facts is ansible.builtin.unreachable

    - name: Fail if Automox Agent service is missing
      ansible.builtin.fail:
        msg: "Automox Agent service is missing"
      when: service_name not in ansible_facts.services

    - name: Restart and enable Automox Agent service when it is not running
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted
        enabled: true
      when:
        - service_name in ansible_facts.services
        - ansible_facts.services[service_name].state != "running"

    - name: Wait for Automox Agent to initialize
      ansible.builtin.pause:
        seconds: "{{ automox_startup_wait }}"
      when:
        - service_name in ansible_facts.services
        - ansible_facts.services[service_name].state != "running"

    - name: Refresh service facts after remediation
      ansible.builtin.service_facts:
      register: automox_remediation_facts
      ignore_unreachable: true

    - name: End compliance check if host became unreachable
      ansible.builtin.meta: end_host
      when: automox_remediation_facts is ansible.builtin.unreachable

    - name: Fail if Automox Agent service is still not running
      ansible.builtin.fail:
        msg: >-
          Automox Agent service exists but could not be restarted.
          Review systemctl status {{ service_name }} and
          journalctl -u {{ service_name }}.
      when:
        - service_name in ansible_facts.services
        - ansible_facts.services[service_name].state != "running"